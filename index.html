<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajal | Coming Soon</title>
    <meta name="description" content="Sajal - Quant, AI Engineer, Automation Engineer, Founder. Coming Soon.">
    
    <!-- Google Fonts: JetBrains Mono & Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Subtle Background Ambient Grid & Particles -->
    <canvas id="ambient-canvas" class="ambient-canvas"></canvas>
    
    <!-- Minimalist Top Controls (Sound & Replay) -->
    <header class="top-controls">
        <button id="sound-btn" class="control-btn" aria-label="Toggle digital audio synthesis">
            <svg class="icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span class="btn-label">SOUND [OFF]</span>
        </button>
        
        <button id="replay-btn" class="control-btn hidden" aria-label="Replay animation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <polyline points="23 20 23 14 17 14"></polyline>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
            <span class="btn-label">REPLAY</span>
        </button>
    </header>

    <!-- PRELOADER (Full Screen Centerpiece) -->
    <main class="preloader-container">
        <!-- Scanlines & Vignette for subtle digital depth -->
        <div class="scanline"></div>
        <div class="radial-vignette"></div>

        <div class="preloader-content">
            <!-- Role Category / Status Pill -->
            <div class="role-badge-container">
                <span class="bracket">[</span>
                <span id="role-badge" class="badge-text">INITIALIZING</span>
                <span class="bracket">]</span>
            </div>

            <!-- Central Animated Digital Text Display -->
            <div class="display-box">
                <div class="scramble-wrapper">
                    <h1 id="scramble-text" class="digital-text" data-text="01010101">01010101</h1>
                </div>
                <div id="role-description" class="role-desc">SYSTEM_BOOT_SEQUENCE</div>
            </div>

            <!-- Sleek Digital Progress Section -->
            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-label" id="progress-status">COMPILING ASSETS</span>
                    <span class="progress-val" id="progress-percent">00%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
                <div class="telemetry-bar">
                    <span id="telemetry-module">MODULE: KERNEL_LOAD</span>
                    <span id="telemetry-hash">0x7F...8A2</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
